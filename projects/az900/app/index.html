<body>

<!-- Title Section -->
<section>
     <h1 class="text-6xl lg:text-7xl font-bold text-blue-600 text-center pt-5 pb-5">AZ-900 Practice Test</h1>
     <img src="./az900_badge.png" alt="AZ-900 Badge" class="mx-auto" style="-webkit-filter: drop-shadow(5px 5px 5px #222); filter: drop-shadow(5px 5px 5px #222);">
</section>

<!-- Intro and Options Section -->
<section>
    <div
    class="bg-bg-card rounded-2xl shadow-md border border-blue-600 border-[4px]
        p-7 sm:p-8 lg:p-9 xl:p-10 p-grey-400
        justify-center items-center
        max-w-5xl mx-auto mt-10 mb-10">

        <p class="mb-5"> To prepare for the AZ-900 certification exam, take this practice test and assess your knowledge of Azure! You can break down the various topics and work on what you most need to improve. We reccomend achieving a score of at least 75% before taking the real deal.</p>

        <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-blue-600 mb-2 sm:mb-8">OPTIONS</h2>
        
        <div x-data="{ open: false }">
            <div 
                class="cursor-pointer mb-1 sm:mb-2 hover:bg-grey-200 rounded transition px-1"
                @click="open = !open"
            >
                <input type="checkbox" id="topics" name="topics">
                <label for="topics">Topics</label><br>
                <span 
                    class="text-text-extra text-lg transition-transform duration-300"
                    :class="{ 'rotate-180': open }"
                    >
                    &#x25BC;
                </span>
            </div>
            <div x-show="open" x-transition>
                <input type="checkbox" id="topic1" name="topic1">
                <label for="topic1">Describe cloud computing</label><br>

                <input type="checkbox" id="topic2" name="topic2">
                <label for="topic2">Describe the benefits of using cloud services</label><br>

                <input type="checkbox" id="topic3" name="topic3">
                <label for="topic3">Describe cloud service types</label><br>

                <input type="checkbox" id="topic4" name="topic4">
                <label for="topic4">Describe the core architectural components of Azure</label><br>

                <input type="checkbox" id="topic5" name="topic5">
                <label for="topic5">Describe Azure compute and networking services</label><br>

                <input type="checkbox" id="topic6" name="topic6">
                <label for="topic6">Describe Azure storage services</label><br>

                <input type="checkbox" id="topic7" name="topic7">
                <label for="topic7">Describe Azure identity, access, and security</label><br>

                <input type="checkbox" id="topic8" name="topic8">
                <label for="topic8">Describe cost management of Azure</label><br>

                <input type="checkbox" id="topic9" name="topic9">
                <label for="topic9">Describe features and tools in Azure for governance and compliance</label><br>

                <input type="checkbox" id="topic10" name="topic10">
                <label for="topic10">Describe features and tools for managing and deploying Azure resources</label><br>
            
                <input type="checkbox" id="topic11" name="topic11">
                <label for="topic11">Describe monitoring tools in Azure</label><br>
            </div>
        </div>
    </div>
   
</section>
    
</body>
