<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Test</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
  <script type="module" src="keyboard.js" defer></script>
</head>
<body>
  <div id="keyboard-tab" class="keyboard-tab">
    <!-- JS will populate the 26 letters here -->
  </div>

  <div id="answers" class="answers">
  </div>

  <div id="game-area" class="game-wrapper">
    <div class="word-container">
      <input type="text" maxlength="1" class="letter-box input-box" />
      <input type="text" maxlength="1" class="letter-box input-box" />
      <input type="text" maxlength="1" class="letter-box input-box" />
      <input type="text" maxlength="1" class="letter-box input-box" />
      <input type="text" maxlength="1" class="letter-box input-box" />
    </div>
    <div class="error-message" id="error-message"></div>
    <button class="guess-button">Guess</button>
  </div>

  <div id="end-screen" class="end-screen hidden">
    <h1 id="end-heading"></h1>
    <p id="end-subtext"></p>
    <button id="play-again">Play Again</button>
  </div>

<script type="module">
  import {
    loadWords,
    guess,
    addGuessResult,
    resetInputBoxes,
    showInvalidFeedback,
    checkCorrect,
    findBestGuesses,
    filterAnswers,
    showEndScreen
  } from './script.js';

  import {
    initKeyboardTab,
    updateKeyboard,
    resetKeyboard
  } from './keyboard.js';

  // --- DOM ---
  const boxes = document.querySelectorAll('.input-box');
  const button = document.querySelector('.guess-button');
  const answersDiv = document.getElementById('answers');
  const gameArea = document.getElementById('game-area');
  const endScreen = document.getElementById('end-screen');
  const playAgainBtn = document.getElementById('play-again');

  // --- STATE ---
  let answer;
  let numGuesses;
  let guessWords;
  let answers;
  let possibleAnswers;
  let guessList;

  // --- INIT ---
  async function initUI() {
    guessWords = new Set([
      ...(await loadWords('assets/allowed-guesses')),
      ...(await loadWords('assets/answers'))
    ]);
    answers = await loadWords('assets/answers');

    guessList = [...guessWords];
    possibleAnswers = [...answers];  

    const bestInitialGuesses = ["ROATE", "SOARE", "RAISE", "RAILE", "REAST"]

    setupInputHandlers();
    setupButtons();
    initKeyboardTab();

    newGame();
  }

  // --- INPUT HANDLING ---
  function setupInputHandlers() {
    boxes.forEach((box, i) => {
      box.addEventListener('input', e => {
        e.target.value = e.target.value.toUpperCase().slice(0, 1);
        if (e.target.value && i < boxes.length - 1) {
          boxes[i + 1].focus();
        }
      });

      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          boxes[i - 1].focus();
        }
        if (e.key === 'ArrowLeft' && i > 0) {
          boxes[i - 1].focus();
        }
        if (e.key === 'ArrowRight' && i < boxes.length - 1) {
          boxes[i + 1].focus();
        }
        if (e.key === 'Enter') {
          doGuess();
        }
      });
    });

    boxes[0].focus();
  }

  // --- BUTTONS ---
  function setupButtons() {
    button.addEventListener('click', doGuess);
    playAgainBtn.addEventListener('click', newGame);
  }

  // --- GAME LOGIC ---
  function getCurrentGuess() {
    return [...boxes].map(b => b.value || '').join('');
  }

  function doGuess() {
    const currentGuess = getCurrentGuess();
    const res = guess(currentGuess, answer, guessWords);

    if (res === "INVALID") {
      showInvalidFeedback();
      return;
    }

    addGuessResult(currentGuess, res);
    updateKeyboard(currentGuess, res);
    numGuesses++;

    possibleAnswers = filterAnswers(
        possibleAnswers,
        currentGuess,
        res,
        guessWords
    );

    const bestGuess = findBestGuesses(guessList, possibleAnswers, guessWords);
    console.log(bestGuess);

    if (checkCorrect(res)) {
      showEndScreen({ won: true });
      return;
    }

    if (numGuesses > 4) {
      showEndScreen({ won: false, answer });
      return;
    }

    resetInputBoxes();
  }

  function newGame() {
    answer = answers[Math.floor(Math.random() * answers.length)];
    numGuesses = 0;
    possibleAnswers = [...answers]
    //console.log("Answer:", answer);

    answersDiv.innerHTML = '';
    resetInputBoxes();
    resetKeyboard();

    gameArea.classList.remove('hidden');
    endScreen.classList.add('hidden');
  }

  initUI();
  </script>
</body>
</html>
