<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="project-title">Projects</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/colors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
  <script type="module" src="../../js/header.js"></script>

  <style>
    /* ── Search + filter bar ── */
    #search-input {
      background: var(--bg-card);
      color: var(--text-text);
      border: 2px solid var(--border4);
      border-radius: 0.75rem;
      padding: 0.55rem 1rem 0.55rem 2.6rem;
      font-size: 1rem;
      width: 100%;
      max-width: 28rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    #search-input:focus {
      border-color: var(--border2);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    #search-input::placeholder { color: var(--text-subtext); opacity: 0.7; }

    .filter-btn {
      background: var(--bg-card);
      color: var(--text-subtext);
      border: 2px solid var(--border4);
      border-radius: 9999px;
      padding: 0.3rem 0.95rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--border2); color: var(--text-text); }
    .filter-btn.active {
      background: var(--primary-600);
      color: #fff;
      border-color: var(--primary-600);
    }
    .dark .filter-btn.active { background: var(--primary-500); border-color: var(--primary-500); }

    .sort-select {
      background: var(--bg-card);
      color: var(--text-text);
      border: 2px solid var(--border4);
      border-radius: 0.75rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .sort-select:focus { border-color: var(--border2); }

    /* ── Project card ── */
    .project-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border4);
      border-radius: 1rem;
      padding: 1.1rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .project-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--primary-400);
      opacity: 0;
      border-radius: 3px 0 0 3px;
      transition: opacity 0.18s;
    }
    .project-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px var(--shadow-color); border-color: var(--border3); }
    .project-card:hover::before { opacity: 1; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .card-title { font-weight: 700; font-size: 1.05rem; color: var(--text-title); line-height: 1.3; }
    .card-date { font-size: 0.78rem; color: var(--text-subtext); white-space: nowrap; padding-top: 0.1rem; }
    .card-summary { font-size: 0.82rem; color: var(--text-subtext); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.15rem; }
    .card-skills { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .skill-tag {
      font-size: 0.7rem;
      background: var(--bg-extra1);
      color: var(--text-link);
      border-radius: 9999px;
      padding: 0.15rem 0.55rem;
      font-weight: 500;
    }
    .card-state {
      font-size: 0.7rem;
      padding: 0.15rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .state-completed  { background: var(--bg-extra4); color: var(--text-title-extra4); }
    .state-wip        { background: var(--bg-extra2); color: var(--text-title-extra2); }
    .state-abandoned  { background: #fee2e2; color: #991b1b; }
    .dark .state-abandoned { background: #450a0a; color: #fca5a5; }

    /* count badge */
    #result-count { font-size: 0.82rem; color: var(--text-subtext); }

    /* empty state */
    #empty-state { display: none; text-align: center; padding: 3rem; color: var(--text-subtext); }
    #empty-state svg { margin: 0 auto 1rem; opacity: 0.3; }

    /* ── responsive grid ── */
    #project_list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 768px)  { #project_list { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1280px) { #project_list { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1600px) { #project_list { grid-template-columns: repeat(4, 1fr); } }

    /* page header */
    .page-hero {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }
    .page-hero h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .page-hero p { color: var(--text-subtext); font-size: clamp(0.9rem, 2vw, 1.1rem); }
  </style>
</head>

<body class="bg-bg-main text-text-text font-sans">

  <!-- Header -->
  <header class="bg-bg-header shadow">
    <nav class="mx-auto flex items-center justify-between max-w-none px-2 sm:px-4 lg:px-6 h-10 sm:h-12 lg:h-16">
      <h1 id="side-title" class="font-bold tracking-tight text-lg sm:text-l lg:text-xl 2xl:text-2xl">Loading...</h1>
      <button id="menu-toggle" class="md:hidden aspect-square flex items-center justify-center rounded hover:bg-bg-simple_hover focus:outline-none w-10 p-1" aria-label="Open menu">☰</button>
      <ul class="hidden md:flex items-center space-x-6 xl:text-xl">
        <li><button class="w-9 h-9 flex items-center justify-center rounded-md p-1 hover:bg-bg-simple_hover transition theme-toggle" aria-label="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-9 h-9"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button></li>
        <li><button class="w-9 h-9 flex items-center justify-center rounded-md p-1 hover:bg-bg-simple_hover transition color-toggle" aria-label="Toggle color"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-9 h-9"><path d="M12 6a8 8 0 1 0 7.9 9.5h-2.1A6 6 0 1 1 12 8v3l4-4-4-4v3z"/></svg></button></li>
        <li><button class="hover:text-text-hover focus:outline-none home-button">Home</button></li>
        <li><a href="/projects" class="hover:text-text-hover">Projects</a></li>
        <li><a href="/contact" class="hover:text-text-hover">Contact</a></li>
      </ul>
    </nav>
    <div id="mobile-menu" class="md:hidden bg-bg-header border-t border-gray-200 overflow-hidden max-h-0 opacity-0 -translate-y-2 transition-all duration-300 ease-in-out">
      <ul class="flex items-center justify-between px-6 py-1 sm:py-2">
        <li><button class="w-9 h-9 flex items-center justify-center rounded-md p-1 hover:bg-bg-simple_hover transition theme-toggle" aria-label="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-9 h-9"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button></li>
        <li><button class="w-9 h-9 flex items-center justify-center rounded-md p-1 hover:bg-bg-simple_hover transition color-toggle" aria-label="Toggle color"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-9 h-9"><path d="M12 6a8 8 0 1 0 7.9 9.5h-2.1A6 6 0 1 1 12 8v3l4-4-4-4v3z"/></svg></button></li>
        <li><button class="hover:text-text-hover focus:outline-none home-button">Home</button></li>
        <li><a href="/projects" class="py-2">Projects</a></li>
        <li><a href="/contact" class="py-2">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Hero -->
  <div class="page-hero">
    <h1>Projects</h1>
    <p>A collection of personal and academic work</p>
  </div>

  <!-- Controls -->
  <div class="mx-4 sm:mx-8 lg:mx-12 mb-4 flex flex-col gap-3">
    <!-- Search row -->
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
      <div class="relative w-full sm:w-auto">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="search" placeholder="Search projects…" aria-label="Search projects" autocomplete="off" />
      </div>
      <select id="sort-select" class="sort-select" aria-label="Sort projects">
        <option value="default">Sort: Default</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="alpha">A → Z</option>
        <option value="alpha-desc">Z → A</option>
      </select>
      <span id="result-count" class="ml-auto"></span>
    </div>

    <!-- Filter row: state -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-sm text-text-subtext font-medium mr-1">Status:</span>
      <button class="filter-btn active" data-filter-state="all">All</button>
      <button class="filter-btn" data-filter-state="completed">Completed</button>
      <button class="filter-btn" data-filter-state="wip">In Progress</button>
      <button class="filter-btn" data-filter-state="abandoned">Abandoned</button>
    </div>

    <!-- Filter row: type -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-sm text-text-subtext font-medium mr-1">Type:</span>
      <button class="filter-btn active" data-filter-type="all">All</button>
      <button class="filter-btn" data-filter-type="personal">Personal</button>
      <button class="filter-btn" data-filter-type="academic">Academic</button>
      <button class="filter-btn" data-filter-type="work">Work</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="mx-4 sm:mx-8 lg:mx-12 mb-12">
    <div id="project_list"></div>
    <div id="empty-state">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p class="text-lg font-medium">No projects match your filters</p>
      <p class="text-sm mt-1">Try adjusting your search or filters</p>
    </div>
  </div>

  <script src="./project-data.js"></script>
  <script>
    // ── state ──────────────────────────────────────────────────────────
    let activeState = 'all';
    let activeType  = 'all';
    let searchQ     = '';
    let sortMode    = 'default';
    const allEntries = Object.entries(projects);

    // ── helpers ────────────────────────────────────────────────────────
    function parseDate(str) {
      if (!str || str.toLowerCase() === 'present') return new Date();
      return new Date(str);
    }

    function matchesFilters([key, p]) {
      if (activeState !== 'all' && p.tags?.state !== activeState) return false;
      if (activeType  !== 'all' && p.tags?.type  !== activeType)  return false;
      if (searchQ) {
        const q = searchQ.toLowerCase();
        const haystack = [p.title, p.summary, ...(p.skills||[])].join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    }

    function sortedEntries(entries) {
      const copy = [...entries];
      switch (sortMode) {
        case 'newest':    return copy.sort((a,b) => parseDate(b[1].end) - parseDate(a[1].end));
        case 'oldest':    return copy.sort((a,b) => parseDate(a[1].start) - parseDate(b[1].start));
        case 'alpha':     return copy.sort((a,b) => a[1].title.localeCompare(b[1].title));
        case 'alpha-desc':return copy.sort((a,b) => b[1].title.localeCompare(a[1].title));
        default:          return copy;
      }
    }

    // ── render ─────────────────────────────────────────────────────────
    function render() {
      const container = document.getElementById('project_list');
      const emptyState = document.getElementById('empty-state');
      const countEl   = document.getElementById('result-count');
      container.innerHTML = '';

      const filtered = sortedEntries(allEntries.filter(matchesFilters));
      countEl.textContent = `${filtered.length} project${filtered.length !== 1 ? 's' : ''}`;

      if (!filtered.length) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      filtered.forEach(([key, project], i) => {
        const card = document.createElement('a');
        card.href = `project.html?key=${key}`;
        card.className = 'project-card';
        card.style.animationDelay = `${i * 40}ms`;

        const state = project.tags?.state || '';
        const stateLabel = { completed: 'Completed', wip: 'In Progress', abandoned: 'Abandoned' }[state] || state;
        const stateClass  = { completed: 'state-completed', wip: 'state-wip', abandoned: 'state-abandoned' }[state] || '';

        const topSkills = (project.skills || []).slice(0, 4);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${escHtml(project.title)}</span>
            <span class="card-date">${escHtml(project.start)} – ${escHtml(project.end)}</span>
          </div>
          ${project.summary ? `<p class="card-summary">${escHtml(project.summary)}</p>` : ''}
          <div class="card-footer">
            <div class="card-skills">
              ${topSkills.map(s => `<span class="skill-tag">${escHtml(s)}</span>`).join('')}
              ${project.skills?.length > 4 ? `<span class="skill-tag">+${project.skills.length - 4}</span>` : ''}
            </div>
            ${stateLabel ? `<span class="card-state ${stateClass}">${stateLabel}</span>` : ''}
          </div>`;

        container.appendChild(card);
      });
    }

    function escHtml(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── event wiring ───────────────────────────────────────────────────
    document.getElementById('search-input').addEventListener('input', e => {
      searchQ = e.target.value.trim();
      render();
    });

    document.getElementById('sort-select').addEventListener('change', e => {
      sortMode = e.target.value;
      render();
    });

    document.querySelectorAll('[data-filter-state]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter-state]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeState = btn.dataset.filterState;
        render();
      });
    });

    document.querySelectorAll('[data-filter-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-filter-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeType = btn.dataset.filterType;
        render();
      });
    });

    render();
  </script>
</body>
</html>
