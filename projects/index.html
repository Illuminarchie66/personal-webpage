<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="project-title">Projects</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/project_index.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/colors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
  <script type="module" src="../../js/header.js"></script>
</head>

<body class="bg-bg-main text-text-text font-sans">

  <!-- Header -->
  <div id="header"></div>

  <!-- Hero -->
  <div class="page-hero">
    <h1>Projects</h1>
    <p>A collection of personal and academic work</p>
  </div>

  <!-- Controls -->
  <div class="mx-4 sm:mx-8 lg:mx-12 mb-4 flex flex-col gap-3">
    <!-- Search row -->
    <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
      <div class="relative w-full sm:w-auto">
        <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="search" placeholder="Search projects…" aria-label="Search projects" autocomplete="off" />
      </div>
      <select id="sort-select" class="sort-select" aria-label="Sort projects">
        <option value="default">Sort: Default</option>
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="alpha">A → Z</option>
        <option value="alpha-desc">Z → A</option>
      </select>
      <span id="result-count" class="ml-auto"></span>
    </div>

    <!-- Filter row: state -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-sm text-text-subtext font-medium w-12 shrink-0">
        Status:
      </span>
      <button class="filter-btn active" data-filter-state="all">All</button>
      <button class="filter-btn" data-filter-state="completed">Completed</button>
      <button class="filter-btn" data-filter-state="wip">In Progress</button>
      <button class="filter-btn" data-filter-state="planned">Planned</button>
    </div>

    <!-- Filter row: type -->
    <div class="flex flex-wrap gap-2 items-center">
      <span class="text-sm text-text-subtext font-medium w-12 shrink-0">
        Type:
      </span>
      <button class="filter-btn active" data-filter-type="all">All</button>
      <button class="filter-btn" data-filter-type="personal">Personal</button>
      <button class="filter-btn" data-filter-type="academic">Academic</button>
      <button class="filter-btn" data-filter-type="work">Work</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="mx-4 sm:mx-8 lg:mx-12 mb-12">
    <div id="project_list"></div>
    <div id="empty-state">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p class="text-lg font-medium">No projects match your filters</p>
      <p class="text-sm mt-1">Try adjusting your search or filters</p>
    </div>
  </div>

  <script src="../js/project_data.js"></script>
  <script src="../js/project_search.js"></script>
</body>
</html>
