<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="project-title">Project</title>
  <link rel="stylesheet" href="../css/main.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/project_md.css">
  <script type="module" src="../js/colors.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <script type="module" src="../../js/header.js"></script>
</head>

<body class="bg-bg-main text-text-text font-sans">

  <div id="reading-progress" aria-hidden="true"></div>

  <!-- Side nav arrows (desktop) -->
  <a id="side-prev" class="side-nav-btn" aria-label="Previous project">&#x276E;</a>
  <a id="side-next" class="side-nav-btn" aria-label="Next project">&#x276F;</a>

  <!-- Header -->
  <div id="header"></div>

  <!-- Main layout grid -->
  <div class="project-layout">

    <!-- Hero: full width -->
    <div class="project-hero">
      <h1 id="title">Loading…</h1>

      <div class="project-meta">
        <span class="meta-item" id="dates-meta"></span>
        <span class="meta-sep" id="type-sep" style="display:none">·</span>
        <span class="meta-item" id="type-meta"></span>
        <span class="meta-sep" id="state-sep" style="display:none">·</span>
        <span id="state-meta"></span>
      </div>

      <p id="summary-text" class="project-summary" style="display:none"></p>

      <div class="skills-row" id="skills-row"></div>

      <div id="links"></div>
    </div>

    <hr class="hero-divider" />

    <!-- Mobile TOC accordion -->
    <div class="toc-mobile" id="toc-mobile">
      <button class="toc-mobile-toggle" id="toc-toggle" aria-expanded="false">
        <span>Table of Contents</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="toc-mobile-body" id="toc-mobile-body">
        <ul class="toc-list" id="toc-list-mobile"></ul>
      </div>
    </div>

    <!-- Article -->
    <div class="article-wrap">
      <div class="article-card">
        <!-- Loading skeleton -->
        <div id="loading-state">
          <div class="skeleton-line tall wide"></div>
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line med"></div>
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line wide" style="margin-top:1rem"></div>
          <div class="skeleton-line wide"></div>
          <div class="skeleton-line med"></div>
        </div>
        <!-- Error state -->
        <div id="error-state">
          <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p id="error-msg" class="text-lg font-semibold">Failed to load content</p>
          <p class="text-sm mt-1">Check the project key in the URL or try refreshing</p>
          <button onclick="location.reload()" style="margin-top:1rem;padding:0.4rem 1rem;border-radius:0.5rem;border:1.5px solid var(--border3);cursor:pointer;font-size:0.85rem;">Retry</button>
        </div>
        <!-- Content -->
        <article id="content" class="prose max-w-full mx-auto break-words" style="display:none"></article>
      </div>
    </div>

    <!-- Desktop TOC sidebar -->
    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
      <div class="toc-title">Contents</div>
      <ul class="toc-list" id="toc-list-desktop">
        <li id="toc-empty" style="display:none">No headings found</li>
      </ul>
    </aside>

    <!-- Bottom nav (mobile) -->
    <div class="bottom-nav" id="bottom-nav"></div>

  </div><!-- /project-layout -->

  <script src="../js/project_data.js"></script>
  <script src="../js/project_page.js"></script>
</body>
</html>
