<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="project-title">Project</title>
  <link rel="stylesheet" href="../css/main.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/project_md.css">
  <script type="module" src="../js/colors.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <script type="module" src="../../js/header.js"></script>

  <style>
    /* ── Reading progress bar ── */
    #reading-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--primary-500), var(--primary-300));
      z-index: 9999;
      transition: width 0.08s linear;
      border-radius: 0 2px 2px 0;
    }

    /* ── Layout shell ── */
    .project-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      max-width: 2400px;
      margin: 0 auto;
      padding: 1rem 1rem 3rem;
    }

    @media (min-width: 1200px) {
      .project-layout {
        /* article takes the bulk of space; TOC is fixed-width on right; no left spacer needed */
        grid-template-columns: 1fr 340px;
        align-items: start;
        padding: 2rem 2.5rem 4rem;
        gap: 2rem;
      }
    }
    @media (min-width: 1600px) {
      .project-layout {
        grid-template-columns: 1fr 380px;
        gap: 2.5rem;
      }
    }
    @media (min-width: 2000px) {
      .project-layout {
        grid-template-columns: 1fr 420px;
        padding: 2rem 4rem 4rem;
      }
    }

    /* ── Project hero ── */
    .project-hero {
      grid-column: 1 / -1;
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
    }
    .project-hero h1 {
      font-size: clamp(2rem, 4vw, 5rem);
      font-weight: 800;
      color: var(--text-title);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .project-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.25rem;
      color: var(--text-subtext);
      font-size: clamp(0.9rem, 1.2vw, 1.25rem);
      margin-bottom: 0.75rem;
    }
    .project-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .project-meta .meta-sep { opacity: 0.3; }

    /* Skills pills */
    .skills-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .skill-pill {
      font-size: clamp(0.75rem, 0.9vw, 1rem);
      background: var(--bg-extra1);
      color: var(--text-link);
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .skill-pill:hover { background: var(--bg-hover); }

    /* State badge */
    .state-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: clamp(0.72rem, 0.85vw, 0.95rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }
    .state-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .state-completed  { background: var(--bg-extra4); color: var(--text-title-extra4); }
    .state-completed::before  { background: var(--text-title-extra4); }
    .state-wip        { background: var(--bg-extra2); color: var(--text-title-extra2); }
    .state-wip::before        { background: var(--text-title-extra2); }
    .state-abandoned  { background: #fee2e2; color: #991b1b; }
    .dark .state-abandoned { background: #450a0a; color: #fca5a5; }
    .state-abandoned::before  { background: #991b1b; }

    /* Summary block */
    .project-summary {
      max-width: 80ch;
      margin: 0 auto 0.75rem;
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: var(--text-subtext);
      line-height: 1.65;
      text-align: center;
    }

    /* Links row */
    #links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1rem;
      margin-bottom: 0.5rem;
    }
    #links .link-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: clamp(0.85rem, 1vw, 1.1rem);
      color: var(--text-link);
      text-decoration: none;
      padding: 0.4rem 1rem;
      border: 1.5px solid var(--border4);
      border-radius: 9999px;
      background: var(--bg-card);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      font-weight: 500;
    }
    #links .link-item:hover {
      border-color: var(--border2);
      box-shadow: 0 2px 10px var(--light-shadow-color);
      transform: translateY(-1px);
      color: var(--text-hover);
    }
    #links .link-item img { width: 1.1em; height: 1.1em; }

    /* ── Divider ── */
    .hero-divider {
      grid-column: 1 / -1;
      border: none;
      border-top: 1.5px solid var(--border4);
      margin: 0;
    }

    /* ── Left spacer (desktop) ── */
    .left-spacer { display: none; }
    @media (min-width: 1200px) { .left-spacer { display: block; } }

    /* ── Article area ── */
    .article-wrap {
      min-width: 0; /* prevent grid blowout */
    }
    .article-card {
      background: var(--bg-card);
      border-radius: 1.25rem;
      padding: clamp(1rem, 3vw, 2.5rem);
      box-shadow: 0 2px 16px var(--light-shadow-color);
    }

    /* ── Loading skeleton ── */
    #loading-state {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 0;
    }
    .skeleton-line {
      height: 1rem;
      background: linear-gradient(90deg, var(--bg-bottom) 25%, var(--bg-main) 50%, var(--bg-bottom) 75%);
      background-size: 200% 100%;
      border-radius: 0.5rem;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-line.wide  { width: 100%; }
    .skeleton-line.med   { width: 75%; }
    .skeleton-line.short { width: 50%; }
    .skeleton-line.tall  { height: 1.4rem; margin-bottom: 0.5rem; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* Error state */
    #error-state {
      display: none;
      text-align: center;
      padding: 2rem;
      color: #ef4444;
    }
    #error-state svg { margin: 0 auto 0.75rem; }

    /* ── TOC sidebar ── */
    .toc-sidebar {
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 5rem);
      overflow-y: auto;
      background: var(--bg-card);
      border: 1.5px solid var(--border4);
      border-radius: 1rem;
      padding: 1rem 1.1rem;
      font-size: clamp(0.8rem, 0.85vw, 1rem);
      scrollbar-width: thin;
    }
    /* Mobile: TOC hidden by default, shown as accordion */
    .toc-sidebar { display: none; }
    @media (min-width: 1200px) { .toc-sidebar { display: block; } }

    .toc-mobile {
      grid-column: 1 / -1;
      background: var(--bg-card);
      border: 1.5px solid var(--border4);
      border-radius: 0.75rem;
      overflow: hidden;
    }
    @media (min-width: 1200px) { .toc-mobile { display: none; } }

    .toc-mobile-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      font-weight: 600;
      font-size: clamp(0.9rem, 1.1vw, 1.1rem);
      color: var(--text-text);
      background: none;
      border: none;
      cursor: pointer;
    }
    .toc-mobile-toggle svg { transition: transform 0.2s; }
    .toc-mobile-toggle.open svg { transform: rotate(180deg); }
    .toc-mobile-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 1rem;
    }
    .toc-mobile-body.open { max-height: 400px; padding: 0 1rem 0.75rem; }

    .toc-title {
      font-weight: 700;
      color: var(--text-title);
      font-size: clamp(0.72rem, 0.8vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.6rem;
    }
    .toc-list { list-style: none; padding: 0; margin: 0; }
    .toc-list li { margin: 0; }
    .toc-list a {
      display: block;
      padding: 0.3rem 0.5rem;
      color: var(--text-subtext);
      text-decoration: none;
      border-left: 2px solid transparent;
      border-radius: 0 0.25rem 0.25rem 0;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      line-height: 1.4;
      font-size: clamp(0.78rem, 0.82vw, 0.95rem);
    }
    .toc-list a:hover, .toc-list a.active {
      color: var(--text-link);
      border-left-color: var(--primary-400);
      background: var(--bg-hover);
    }
    .toc-list .toc-h3 a { padding-left: 1rem; font-size: clamp(0.72rem, 0.78vw, 0.9rem); }
    .toc-list .toc-h4 a { padding-left: 1.75rem; font-size: clamp(0.68rem, 0.74vw, 0.85rem); }
    #toc-empty { color: var(--text-subtext); font-size: 0.85rem; font-style: italic; }

    /* ── Code block wrapper ── */
    .code-block-wrapper {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--bg-main);
      color: var(--text-subtext);
      border: 1px solid var(--border4);
      border-radius: 0.4rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      z-index: 10;
      line-height: 1.5;
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--primary-600); color: #fff; border-color: var(--primary-600); }
    .copy-btn.copied { background: #16a34a; color: #fff; border-color: #16a34a; opacity: 1; }

    /* ── Side nav arrows ── */
    .side-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      background: var(--bg-card);
      border: 1.5px solid var(--border4);
      border-radius: 50%;
      box-shadow: 0 2px 12px var(--shadow-color);
      text-decoration: none;
      font-size: 1.6rem;
      color: var(--text-extra);
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      cursor: pointer;
      line-height: 1;
    }
    @media (min-width: 900px) { .side-nav-btn { display: flex; } }
    @media (min-width: 1600px) { .side-nav-btn { width: 3.5rem; height: 3.5rem; font-size: 2rem; } }
    .side-nav-btn:hover {
      color: var(--complementary-400);
      border-color: var(--border2);
      box-shadow: 0 4px 20px var(--shadow-color);
      transform: translateY(-50%) scale(1.1);
    }
    #side-prev { left: 0.6rem; }
    #side-next { right: 0.6rem; }
    @media (min-width: 1600px) {
      #side-prev { left: 1rem; }
      #side-next { right: 1rem; }
    }

    /* ── Bottom nav (mobile fallback) ── */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 0 1.5rem;
      grid-column: 1 / -1;
    }
    @media (min-width: 900px) { .bottom-nav { display: none; } }
    .bottom-nav a {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 0.9rem;
      background: var(--bg-card);
      border: 1.5px solid var(--border4);
      border-radius: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-link);
      text-decoration: none;
      font-weight: 600;
      transition: border-color 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }
    .bottom-nav a:hover { border-color: var(--border2); box-shadow: 0 2px 10px var(--light-shadow-color); }
    .bottom-nav .nav-next { justify-content: flex-end; text-align: right; }
    .bottom-nav .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>

  </header>

  <!-- Main layout grid -->
  <div class="project-layout">

    <!-- Hero: full width -->

      <div class="project-meta">
        <span class="meta-item" id="dates-meta"></span>
        <span class="meta-sep" id="type-sep" style="display:none">·</span>
        <span class="meta-item" id="type-meta"></span>
        <span class="meta-sep" id="state-sep" style="display:none">·</span>

    <div class="bottom-nav" id="bottom-nav"></div>

  </div><!-- /project-layout -->

  <script src="./project-data.js"></script>
  <script>
  // ── Setup ─────────────────────────────────────────────────────────────
  const params     = new URLSearchParams(window.location.search);
  const projectKey = params.get('key');
  const project    = projects[projectKey];

  // ── Reading progress ──────────────────────────────────────────────────
  const progressBar = document.getElementById('reading-progress');
  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = `${docHeight > 0 ? Math.min((scrollTop / docHeight) * 100, 100) : 0}%`;
  }, { passive: true });

  // ── TOC toggle (mobile) ───────────────────────────────────────────────
  const tocToggle = document.getElementById('toc-toggle');
  const tocMobileBody = document.getElementById('toc-mobile-body');
  tocToggle.addEventListener('click', () => {
    const open = tocMobileBody.classList.toggle('open');
    tocToggle.classList.toggle('open', open);
    tocToggle.setAttribute('aria-expanded', open);
  });

  // ── Build TOC from rendered headings ─────────────────────────────────
  function buildTOC(articleEl) {
    const headings = articleEl.querySelectorAll('h2, h3, h4');
    const listDesktop = document.getElementById('toc-list-desktop');
    const listMobile  = document.getElementById('toc-list-mobile');
    const tocMobile   = document.getElementById('toc-mobile');
    const tocEmpty    = document.getElementById('toc-empty');

    listDesktop.innerHTML = '';
    listMobile.innerHTML  = '';

    if (!headings.length) {
      tocEmpty.style.display = 'list-item';
      return;
    }
    tocEmpty.style.display = 'none';
    tocMobile.style.display = 'block';

    const allLinks = [];

    headings.forEach((h, i) => {
      if (!h.id) h.id = `heading-${i}`;
      const tag  = h.tagName.toLowerCase();
      const text = h.textContent;

      [listDesktop, listMobile].forEach(list => {
        const li  = document.createElement('li');
        li.className = `toc-${tag}`;
        const a  = document.createElement('a');
        a.href  = `#${h.id}`;
        a.textContent = text;
        a.addEventListener('click', e => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', `#${h.id}`);
        });
        li.appendChild(a);
        list.appendChild(li);
        if (list === listDesktop) allLinks.push({ el: h, a });
      });
    });

    // Highlight active heading on scroll
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const link = allLinks.find(l => l.el === entry.target);
        if (link) link.a.classList.toggle('active', entry.isIntersecting);
      });
    }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });

    allLinks.forEach(({ el }) => observer.observe(el));
  }

  // ── Add copy buttons to code blocks ──────────────────────────────────
  function addCopyButtons(articleEl) {
    articleEl.querySelectorAll('pre').forEach(pre => {
      const wrap = document.createElement('div');
      wrap.className = 'code-block-wrapper';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.setAttribute('aria-label', 'Copy code');
      btn.addEventListener('click', async () => {
        const code = pre.querySelector('code')?.innerText ?? pre.innerText;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
        } catch {
          btn.textContent = 'Error';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        }
      });
      wrap.appendChild(btn);
    });
  }

  // ── Wrap images for horizontal scroll ────────────────────────────────
  function wrapImages(articleEl) {
    articleEl.querySelectorAll('img').forEach(img => {
      if (img.closest('.image-scroll')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'image-scroll';
      img.parentNode.insertBefore(wrapper, img);
      wrapper.appendChild(img);
    });
  }

  // ── Wrap tables ───────────────────────────────────────────────────────
  function wrapTables(articleEl) {
    articleEl.querySelectorAll('table').forEach(tbl => {
      if (tbl.closest('.table-wrapper')) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';
      tbl.parentNode.insertBefore(wrapper, tbl);
      wrapper.appendChild(tbl);
    });
  }

  // ── Load markdown ─────────────────────────────────────────────────────
  async function renderProject(project) {
    const loadingEl = document.getElementById('loading-state');
    const errorEl   = document.getElementById('error-state');
    const contentEl = document.getElementById('content');

    try {
      const response = await fetch(project.markdown);
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      const markdown = await response.text();

      contentEl.innerHTML = marked.parse(markdown);

      renderMathInElement(contentEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false }
        ],
        throwOnError: false
      });

      Prism.highlightAllUnder(contentEl);

      addCopyButtons(contentEl);
      wrapImages(contentEl);
      wrapTables(contentEl);
      buildTOC(contentEl);

      loadingEl.style.display = 'none';
      errorEl.style.display   = 'none';
      contentEl.style.display = 'block';

    } catch (err) {
      console.error('Failed to load markdown:', err);
      loadingEl.style.display = 'none';
      document.getElementById('error-msg').textContent = `Failed to load content: ${err.message}`;
      errorEl.style.display   = 'block';
    }
  }

  // ── Wire up side nav buttons ──────────────────────────────────────────
  function setupNav(project) {
    const sidePrev   = document.getElementById('side-prev');
    const sideNext   = document.getElementById('side-next');
    const bottomNav  = document.getElementById('bottom-nav');

    if (project.prev) {
      const url = `project.html?key=${project.prev.key}`;
      sidePrev.href = url;
      sidePrev.style.display = 'flex';

      const a = document.createElement('a');
      a.href = url;
      a.className = 'nav-prev';
      a.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg><span class="nav-label">${project.prev.label}</span>`;
      bottomNav.appendChild(a);
    }
    if (project.next) {
      const url = `project.html?key=${project.next.key}`;
      sideNext.href = url;
      sideNext.style.display = 'flex';

      const a = document.createElement('a');
      a.href = url;
      a.className = 'nav-next';
      a.innerHTML = `<span class="nav-label">${project.next.label}</span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`;
      bottomNav.appendChild(a);
    }
  }

  // ── Populate hero ─────────────────────────────────────────────────────
  function populateHero(project) {
    document.getElementById('project-title').textContent = project.title;
    document.getElementById('title').textContent = project.title;

    // Dates
    document.getElementById('dates-meta').textContent = `${project.start} – ${project.end}`;

    // Type
    if (project.tags?.type) {
      document.getElementById('type-meta').textContent = project.tags.type.charAt(0).toUpperCase() + project.tags.type.slice(1);
      document.getElementById('type-sep').style.display = 'inline';
    }

    // State badge
    const state = project.tags?.state;
    if (state) {
      const labels = { completed: 'Completed', wip: 'In Progress', abandoned: 'Abandoned' };
      const stateMeta = document.getElementById('state-meta');
      stateMeta.innerHTML = `<span class="state-badge state-${state}">${labels[state] || state}</span>`;
      document.getElementById('state-sep').style.display = 'inline';
    }

    // Summary
    if (project.summary) {
      const s = document.getElementById('summary-text');
      s.textContent = project.summary;
      s.style.display = 'block';
    }

    // Skills
    const skillsRow = document.getElementById('skills-row');
    (project.skills || []).forEach(skill => {
      const span = document.createElement('span');
      span.className = 'skill-pill';
      span.textContent = skill;
      skillsRow.appendChild(span);
    });

    // Links
    const linksEl = document.getElementById('links');
    (project.links || []).forEach(link => {
      const a = document.createElement('a');
      a.className = 'link-item';
      a.href   = link.url;
      a.target = '_blank';
      a.rel    = 'noopener noreferrer';

      const img = document.createElement('img');
      img.className = 'icon-invert';
      img.src = link.icon;
      img.alt = '';
      img.setAttribute('aria-hidden', 'true');

      a.appendChild(img);
      a.appendChild(document.createTextNode(link.label));
      linksEl.appendChild(a);
    });
  }

  // ── Main ──────────────────────────────────────────────────────────────
  if (!project) {
    document.getElementById('title').textContent = 'Project not found';
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
    document.getElementById('error-msg').textContent = 'No project found for this key.';
  } else {
    populateHero(project);
    setupNav(project);
    renderProject(project);
  }
  </script>
</body>
</html>
