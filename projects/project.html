<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="project-title">Project</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="css/project_md.css">

  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX for math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="window.katexLoaded=true;"></script>

	<link href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
	
	<script src="js/header.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

  <!-- === HEADER === -->
<header class="bg-white shadow">
  <nav class="mx-auto flex items-center justify-between
            max-w-none
            px-2 sm:px-4 lg:px-6
            h-10 sm:h-12 lg:h-16">
    <h1 id="side-title"
			class="font-bold tracking-tight
						text-lg sm:text-l lg:text-xl 2xl:text-2xl">
			Loading...
		</h1>
		<button id="menu-toggle"
						class="md:hidden aspect-square flex items-center justify-center rounded hover:bg-gray-100 focus:outline-none w-10"
						aria-label="Open menu">
			☰
		</button>

    <ul class="hidden md:flex items-center space-x-6 xl:text-xl">
      <li><button id="home-button" class="hover:text-blue-600 focus:outline-none ">Home</button></li>

      <li class="relative">
        <button id="projects-button" class="hover:text-blue-600 focus:outline-none">Projects</button>
        <ul id="projects-menu" class="hidden absolute right-0 mt-2 bg-white border border-gray-200 rounded shadow-lg w-48 z-10">
          <li><a href="/mario-map-project/" class="block px-4 py-2 hover:bg-gray-100">Mario Map</a></li>
          <li><a href="/geographic-centre" class="block px-4 py-2 hover:bg-gray-100">Geographic Centre</a></li>
          <li><a href="https://illuminarchie.itch.io/box-quest" class="block px-4 py-2 hover:bg-gray-100">Box Quest</a></li>
		  <li><a href="https://github.com/Illuminarchie66/CS141-Functional-ONAF" class="block px-4 py-2 hover:bg-gray-100">One Night at Freddy's</a></li>
		  <li><a href="https://github.com/Illuminarchie66/SimpLeg" class="block px-4 py-2 hover:bg-gray-100">SimpLeg</a></li>
		  <li><a href="https://example.com" class="block px-4 py-2 hover:bg-gray-100">Project Tracker</a></li>
		  <li><a href="https://github.com/4th-year-group-project/Terra-Infinity" class="block px-4 py-2 hover:bg-gray-100">TerraInfinity</a></li>
        </ul>
      </li>

      <li><a href="#" class="hover:text-blue-600">Contact</a></li>
    </ul>
  </nav>
	<div id="mobile-menu"
			class="md:hidden bg-white border-t border-gray-200
							overflow-hidden
							max-h-0 opacity-0 -translate-y-2
							transition-all duration-300 ease-in-out">
		<ul class="flex items-center justify-between px-6 py-1 sm:py-2 md:py-2">
			<li><a href="#" class="py-2">Home</a></li>
			<li><a href="/projects" class="py-2">Projects</a></li>
			<li><a href="#" class="py-2">Contact</a></li>
		</ul>
	</div>
</header>

  <!-- === MAIN CONTENT === -->
  <main class="max-w-7xl mx-auto p-2 sm:p-6">
    <!-- Project Title -->
    <h1 id="title" class="text-5xl sm:text-4xl lg:text-7xl font-bold text-blue-900 text-center pb-4">a</h1>

    <!-- Dates & Skills -->
    <div class="flex flex-col sm:flex-row justify-center gap-2 sm:gap-6 text-gray-700 pb-2 sm:pb-6 text-center lg:text-2xl">
      <span id="dates" class="font-semibold"></span>
      <span id="skills"></span>
    </div>

    <!-- Links -->
    <div class="flex flex-col sm:flex-row justify-center gap-2 sm:gap-4 pb-6 text-center lg:text-2xl">
      <a id="github-link" class="text-blue-600 hover:underline" target="_blank"></a>
      <a id="other-link" class="text-blue-600 hover:underline" target="_blank"></a>
    </div>

    <!-- Markdown Card -->
    <div class="bg-white rounded-3xl p-2 sm:p-6 shadow-lg">
      <article id="content" class="prose max-w-full mx-auto break-words"></article>
    </div>

    <!-- Navigation -->
    <div class="flex flex-col sm:flex-row justify-between mt-8 text-blue-700 font-semibold">
      <a id="prev-project" class="hover:underline mb-2 sm:mb-0"></a>
      <a id="next-project" class="hover:underline"></a>
    </div>
  </main>

  <!-- Project Data -->
  <script src="/assets/project-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectKey = params.get('key');
    const project = projects[projectKey];

    if (!project) {
      document.getElementById('title').innerText = "Project not found";
      document.getElementById('content').innerHTML = "<p>Check the project key in the URL.</p>";
    } else {
      document.getElementById('project-title').innerText = project.title;
      document.getElementById('title').innerText = project.title;
      document.getElementById('dates').innerText = `${project.start} - ${project.end}`;
      document.getElementById('skills').innerText = project.skills.join(', ');

      const githubLink = document.getElementById('github-link');
      githubLink.href = project.github;
      githubLink.innerText = "GitHub";

      if(project.other) {
        const otherLink = document.getElementById('other-link');
        otherLink.href = project.other.url;
        otherLink.innerText = project.other.label;
      }

      // Render markdown
      document.getElementById('content').innerHTML = marked.parse(project.content);

      // Render math once KaTeX is loaded
      const renderMath = () => {
        if (window.katexLoaded) {
          renderMathInElement(document.getElementById('content'), {
            delimiters: [
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false}
            ]
          });
        } else {
          setTimeout(renderMath, 50);
        }
      };
      renderMath();

      // Navigation
      if(project.prev) {
        const prev = document.getElementById('prev-project');
        prev.href = `/project.html?key=${project.prev.key}`;
        prev.innerText = `<- ${project.prev.label}`;
      }
      if(project.next) {
        const next = document.getElementById('next-project');
        next.href = `/project.html?key=${project.next.key}`;
        next.innerText = `${project.next.label} ->`;
      }
    }
  </script>
</body>
</html>
