<script>
  const params = new URLSearchParams(window.location.search);
  const projectKey = params.get('key');
  const project = projects[projectKey];

  const contentElement = document.getElementById('content');

  async function loadMarkdown(filePath) {
    const response = await fetch(filePath);
    if (!response.ok) {
      throw new Error("Failed to load markdown file.");
    }
    return await response.text();
  }

  async function renderProject(project) {
    try {
      const markdown = await loadMarkdown(project.markdown);

      // Parse markdown
      contentElement.innerHTML = marked.parse(markdown);

      // Render KaTeX (no polling needed — scripts are defer)
      renderMathInElement(contentElement, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });

      // Highlight code blocks
      Prism.highlightAllUnder(contentElement);

    } catch (err) {
      contentElement.innerHTML = "<p>Failed to load project content.</p>";
      console.error(err);
    }
  }

  if (!project) {
    document.getElementById('title').innerText = "Project not found";
    contentElement.innerHTML = "<p>Check the project key in the URL.</p>";
  } else {
    document.getElementById('project-title').innerText = project.title;
    document.getElementById('title').innerText = project.title;
    document.getElementById('dates').innerText = `${project.start} - ${project.end}`;
    document.getElementById('skills').innerText = project.skills.join(', ');

    const links = document.getElementById('links');
    project.links.forEach(link => {
      const t = document.createElement("div");
      t.className = "flex items-center gap-1";

      const img = document.createElement("img");
      img.className = "w-7 h-7 text-text-link icon-invert";
      img.src = link.icon;
      img.alt = link.label;

      const linkName = document.createElement("a");
      linkName.className = "text-text-link hover:underline hover:text-text-hover";
      linkName.target = "_blank";
      linkName.href = link.url;
      linkName.innerText = link.label;

      t.appendChild(img);
      t.appendChild(linkName);
      links.appendChild(t);
    });

    // 🔥 Load markdown from file
    renderProject(project);

    // Navigation
    if (project.prev) {
      const prev = document.getElementById('prev-project');
      prev.href = `project.html?key=${project.prev.key}`;
      prev.innerText = `<- ${project.prev.label}`;
    }

    if (project.next) {
      const next = document.getElementById('next-project');
      next.href = `project.html?key=${project.next.key}`;
      next.innerText = `${project.next.label} ->`;
    }
  }
</script>
